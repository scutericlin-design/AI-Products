services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./knowledge-base-stack:/app/knowledge-base-stack

  trading-engine:
    build: .
    command: ["python", "-m", "app.trading"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./knowledge-base-stack:/app/knowledge-base-stack
    depends_on:
      - web
