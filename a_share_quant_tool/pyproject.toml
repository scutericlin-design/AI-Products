[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-quant-tool"
version = "0.1.0"
description = "Local-first A-share research, backtest, paper-trading, and guarded QMT adapter"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24", "tushare>=1.4", "pyarrow>=14", "requests>=2.31"]

[project.optional-dependencies]
akshare-fallback = ["akshare>=1.13"]
test = ["pytest>=8"]

[project.scripts]
a-share-quant = "a_share_quant.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
