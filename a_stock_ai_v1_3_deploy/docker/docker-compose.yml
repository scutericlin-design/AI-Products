      HOT_LEADER_PUSH_ENABLED: ${HOT_LEADER_PUSH_ENABLED:-true}
      HOT_LEADER_DRY_RUN: ${HOT_LEADER_DRY_RUN:-false}
      HOT_LEADER_FEISHU_WEBHOOK: ${HOT_LEADER_FEISHU_WEBHOOK:-${FEISHU_WEBHOOK:-}}
      QGARP_PAPER_ENABLED: ${QGARP_PAPER_ENABLED:-false}
      QGARP_PUSH_ENABLED: ${QGARP_PUSH_ENABLED:-false}
      QGARP_DRY_RUN: ${QGARP_DRY_RUN:-true}
      QGARP_UNIVERSE_LIMIT: ${QGARP_UNIVERSE_LIMIT:-250}
      QGARP_BACKTEST_UNIVERSE_SOURCE: ${QGARP_BACKTEST_UNIVERSE_SOURCE:-daily_basic_pit}
      QGARP_BACKTEST_UNIVERSE_LIMIT: ${QGARP_BACKTEST_UNIVERSE_LIMIT:-800}
      QGARP_TUSHARE_BASE_URL: ${QGARP_TUSHARE_BASE_URL:-${TUSHARE_BASE_URL:-}}
      ETF_MINUTE_ENABLED: ${ETF_MINUTE_ENABLED:-false}
      ETF_MINUTE_PAPER_TRADING_ENABLED: ${ETF_MINUTE_PAPER_TRADING_ENABLED:-true}
      ETF_MINUTE_STRATEGY_PROFILE: ${ETF_MINUTE_STRATEGY_PROFILE:-wufu_v7_static}
      ETF_MINUTE_INITIAL_CASH: ${ETF_MINUTE_INITIAL_CASH:-1000000}
      ETF_MINUTE_MAX_POSITION_WEIGHT: ${ETF_MINUTE_MAX_POSITION_WEIGHT:-0.70}
      ETF_MINUTE_SLIPPAGE_RATE: ${ETF_MINUTE_SLIPPAGE_RATE:-0.0005}
      ETF_MINUTE_COMMISSION_RATE: ${ETF_MINUTE_COMMISSION_RATE:-0.0001}
      ETF_MINUTE_MIN_COMMISSION: ${ETF_MINUTE_MIN_COMMISSION:-5}
      ETF_MINUTE_LOT_SIZE: ${ETF_MINUTE_LOT_SIZE:-100}
      ETF_MINUTE_MAX_STALE_SECONDS: ${ETF_MINUTE_MAX_STALE_SECONDS:-180}
      ETF_MINUTE_STOP_LOSS_PCT: ${ETF_MINUTE_STOP_LOSS_PCT:-0.08}
      ETF_MINUTE_AKSHARE_FALLBACK_ENABLED: ${ETF_MINUTE_AKSHARE_FALLBACK_ENABLED:-true}
      ETF_MINUTE_BATCH_SPOT_ENABLED: ${ETF_MINUTE_BATCH_SPOT_ENABLED:-true}
      ETF_MINUTE_BATCH_SPOT_MIN_COVERAGE: ${ETF_MINUTE_BATCH_SPOT_MIN_COVERAGE:-0.90}
      ETF_MINIMAX_ENABLED: ${ETF_MINIMAX_ENABLED:-false}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_ENDPOINT: ${MINIMAX_ENDPOINT:-}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-}
      MINIMAX_FALLBACK_MODEL: ${MINIMAX_FALLBACK_MODEL:-}
      MINIMAX_PROVIDER: ${MINIMAX_PROVIDER:-custom}
      STOCK_AI_PRIMARY_API_KEY: ${STOCK_AI_PRIMARY_API_KEY:-}
      STOCK_AI_PRIMARY_ENDPOINT: ${STOCK_AI_PRIMARY_ENDPOINT:-https://tbtk.asia/v1/chat/completions}
      STOCK_AI_PRIMARY_MODEL: ${STOCK_AI_PRIMARY_MODEL:-deepseek-v4-flash-0731}
      STOCK_AI_SECONDARY_API_KEY: ${STOCK_AI_SECONDARY_API_KEY:-}
      STOCK_AI_SECONDARY_ENDPOINT: ${STOCK_AI_SECONDARY_ENDPOINT:-}
      STOCK_AI_SECONDARY_MODEL: ${STOCK_AI_SECONDARY_MODEL:-minimaxai/minimax-m3}
      STOCK_AI_TERTIARY_API_KEY: ${STOCK_AI_TERTIARY_API_KEY:-}
      STOCK_AI_TERTIARY_ENDPOINT: ${STOCK_AI_TERTIARY_ENDPOINT:-}
      STOCK_AI_TERTIARY_MODEL: ${STOCK_AI_TERTIARY_MODEL:-stepfun-ai/step-3.7-flash}
      AI_DEGRADED_FALLBACK_ENABLED: ${AI_DEGRADED_FALLBACK_ENABLED:-true}
      AI_DEGRADED_POSITION_MULTIPLIER: ${AI_DEGRADED_POSITION_MULTIPLIER:-1.0}
      FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:?Set FEISHU_WEBHOOK in your deployment environment}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_ENABLED: ${FEISHU_ENABLED:-true}
      SEND_IN_DRY_RUN: ${SEND_IN_DRY_RUN:-false}
      STORAGE_DIR: /app/runtime_storage
      SQLITE_DB_PATH: /app/runtime_storage/db.sqlite
    volumes:
      - ../storage:/app/runtime_storage
      - ../etf_strategy/local_data:/app/etf_strategy/local_data
      - ../qgarp_strategy/local_data:/app/qgarp_strategy/local_data
      - ../hot_leader_strategy/local_data:/app/hot_leader_strategy/local_data
    healthcheck:
      test: ["CMD", "python", "-m", "app.main", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  a-stock-dashboard-v1-8:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "dashboard.server"]
    environment:
      APP_NAME: ${APP_NAME:-A股市场实时感知引擎 v1.9}
      ENGINE_NAME: ${ENGINE_NAME:-A股市场实时感知引擎 v1.9}
      ENGINE_POSITIONING: ${ENGINE_POSITIONING:-market_realtime_perception_engine}
      TZ: ${TZ:-Asia/Shanghai}
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 8080
      DASHBOARD_BASE_PATH: ${DASHBOARD_BASE_PATH:-/a-stock-dashboard}
      DASHBOARD_AUTH_ENABLED: ${DASHBOARD_AUTH_ENABLED:-true}
      DASHBOARD_AUTH_USERNAME: ${DASHBOARD_AUTH_USERNAME:-admin}
      DASHBOARD_AUTH_PASSWORD_HASH: ${DASHBOARD_AUTH_PASSWORD_HASH:-}
      DASHBOARD_AUTH_SECRET: ${DASHBOARD_AUTH_SECRET:-}
      DASHBOARD_SESSION_SECONDS: ${DASHBOARD_SESSION_SECONDS:-28800}
      DRY_RUN: ${DRY_RUN:-false}
      RUN_INTERVAL: ${RUN_INTERVAL:-120}
      LOOP_SECONDS: ${LOOP_SECONDS:-120}
      MAX_PUSH_STOCKS: ${MAX_PUSH_STOCKS:-3}
      MAX_POSITION_WEIGHT: ${MAX_POSITION_WEIGHT:-0.12}
      MIN_TURNOVER_YI: ${MIN_TURNOVER_YI:-2.0}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.62}
      MAX_RECOMMEND_PCT_CHANGE: ${MAX_RECOMMEND_PCT_CHANGE:-8.5}
      NEAR_LIMIT_UP_BUFFER: ${NEAR_LIMIT_UP_BUFFER:-0.015}
      BUY_RANGE_PULLBACK_PCT: ${BUY_RANGE_PULLBACK_PCT:-0.008}
      MAX_CHASE_PCT: ${MAX_CHASE_PCT:-0.012}
      STOP_LOSS_PCT: ${STOP_LOSS_PCT:-0.035}
      MIN_QUALITY_SCORE: ${MIN_QUALITY_SCORE:-55}
      SENTIMENT_MIN_BUY_SCORE: ${SENTIMENT_MIN_BUY_SCORE:-53}
      SENTIMENT_RISK_OFF_SCORE: ${SENTIMENT_RISK_OFF_SCORE:-38}
      SENTIMENT_PANIC_THRESHOLD: ${SENTIMENT_PANIC_THRESHOLD:-72}
      SENTIMENT_LOW_COVERAGE_COUNT: ${SENTIMENT_LOW_COVERAGE_COUNT:-5}
      SENTIMENT_FULL_COVERAGE_COUNT: ${SENTIMENT_FULL_COVERAGE_COUNT:-30}
      PAPER_TRADING_ENABLED: ${PAPER_TRADING_ENABLED:-false}
      PAPER_INITIAL_CASH: ${PAPER_INITIAL_CASH:-1000000}
      PAPER_ACCOUNT_PATH: ${PAPER_ACCOUNT_PATH:-/app/runtime_storage/paper_account.json}
      PAPER_MAX_POSITION_PCT: ${PAPER_MAX_POSITION_PCT:-0.12}
      PAPER_SLIPPAGE_PCT: ${PAPER_SLIPPAGE_PCT:-0.001}
      PAPER_COMMISSION_RATE: ${PAPER_COMMISSION_RATE:-0.00025}
      PAPER_MIN_COMMISSION: ${PAPER_MIN_COMMISSION:-5}
      PAPER_STAMP_DUTY_RATE: ${PAPER_STAMP_DUTY_RATE:-0.0005}
      PAPER_LOT_SIZE: ${PAPER_LOT_SIZE:-100}
      PRIMARY_STRATEGY_ID: ${PRIMARY_STRATEGY_ID:-hybrid_alpha}
      HYBRID_ALPHA_LOCK_PARAMETERS: ${HYBRID_ALPHA_LOCK_PARAMETERS:-true}
      MULTI_STRATEGY_ENABLED: ${MULTI_STRATEGY_ENABLED:-true}
      MULTI_STRATEGY_MODE: ${MULTI_STRATEGY_MODE:-shadow}
      MULTI_STRATEGY_MAX_EXPOSURE: ${MULTI_STRATEGY_MAX_EXPOSURE:-0.85}
      MULTI_STRATEGY_PAPER_ENABLED: ${MULTI_STRATEGY_PAPER_ENABLED:-true}
      MARKET_REGIME_CONFIRM_CYCLES: ${MARKET_REGIME_CONFIRM_CYCLES:-2}
      MARKET_REGIME_STATE_PATH: ${MARKET_REGIME_STATE_PATH:-/app/runtime_storage/market_regime_state.json}
      FUNDAMENTAL_CACHE_PATH: ${FUNDAMENTAL_CACHE_PATH:-/app/runtime_storage/fundamental_cache.json}
      FUNDAMENTAL_CACHE_TTL_HOURS: ${FUNDAMENTAL_CACHE_TTL_HOURS:-24}
      QUALITY_GROWTH_INDUSTRIES: ${QUALITY_GROWTH_INDUSTRIES:-半导体,通信,软件,人工智能,电力设备,新能源,高端制造,医药}
      QGARP_STORAGE_DIR: /app/qgarp_strategy/local_data
      HOT_LEADER_STORAGE_DIR: /app/hot_leader_strategy/local_data
      A_SHARE_QUANT_DATA_DIR: ${A_SHARE_QUANT_DATA_DIR:-/app/a_share_quant_data}
      HOT_LEADER_INTRADAY_ENABLED: ${HOT_LEADER_INTRADAY_ENABLED:-true}
      HOT_LEADER_LIVE_THEME_ENABLED: ${HOT_LEADER_LIVE_THEME_ENABLED:-true}
      HOT_LEADER_LIVE_THEME_INTERVAL_MINUTES: ${HOT_LEADER_LIVE_THEME_INTERVAL_MINUTES:-5}
      HOT_LEADER_INTRADAY_ENTRY_ENABLED: ${HOT_LEADER_INTRADAY_ENTRY_ENABLED:-true}
      HOT_LEADER_INTRADAY_INTERVAL_MINUTES: ${HOT_LEADER_INTRADAY_INTERVAL_MINUTES:-2}
      HOT_LEADER_INTRADAY_ENTRY_MIN_CHANGE: ${HOT_LEADER_INTRADAY_ENTRY_MIN_CHANGE:--0.02}
      HOT_LEADER_INTRADAY_ENTRY_MAX_CHANGE: ${HOT_LEADER_INTRADAY_ENTRY_MAX_CHANGE:-0.045}
      HOT_LEADER_INTRADAY_NEAR_LIMIT_BUFFER: ${HOT_LEADER_INTRADAY_NEAR_LIMIT_BUFFER:-0.015}
      HOT_LEADER_INTRADAY_BUY_CUTOFF: "${HOT_LEADER_INTRADAY_BUY_CUTOFF:-14:45}"
      HOT_LEADER_INTRADAY_EVENT_COOLDOWN_MINUTES: ${HOT_LEADER_INTRADAY_EVENT_COOLDOWN_MINUTES:-120}
      QGARP_PAPER_ENABLED: ${QGARP_PAPER_ENABLED:-false}
      QGARP_PUSH_ENABLED: ${QGARP_PUSH_ENABLED:-false}
      QGARP_DRY_RUN: ${QGARP_DRY_RUN:-true}
      QGARP_BACKTEST_UNIVERSE_SOURCE: ${QGARP_BACKTEST_UNIVERSE_SOURCE:-daily_basic_pit}
      QGARP_BACKTEST_UNIVERSE_LIMIT: ${QGARP_BACKTEST_UNIVERSE_LIMIT:-800}
      SELF_LEARNING_MAX_STEP_PCT: ${SELF_LEARNING_MAX_STEP_PCT:-0.08}
      STORAGE_DIR: /app/runtime_storage
      SQLITE_DB_PATH: /app/runtime_storage/db.sqlite
    volumes:
      - ../storage:/app/runtime_storage
      # Dashboard queries stay SQLite read-only in code. The mount must permit
      # SQLite's WAL shared-memory files so live ETF data remains readable.
      - ../etf_strategy/local_data:/app/etf_strategy/local_data
      - ../qgarp_strategy/local_data:/app/qgarp_strategy/local_data:ro
      # Hot-leader storage initializes schema migrations on first dashboard read.
      # The dashboard has no mutation endpoints, but SQLite needs this access.
      - ../hot_leader_strategy/local_data:/app/hot_leader_strategy/local_data
      # TuShare/DeepSeek research artifacts are produced outside this service.
      # Mount read-only: dashboard requests must never mutate research archives.
      - ../../a_share_quant_tool/data:/app/a_share_quant_data:ro
      # Stock Alpha has its own worker and ledger; dashboard access is read-only.
      - ${STOCK_ALPHA_RUNTIME_DIR:-/opt/chixiao-stock-alpha/runtime}:/app/stock_alpha_runtime:ro
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    depends_on:
      - a-stock-ai-v1-4
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/a-stock-dashboard/api/ping', timeout=5).read()",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
