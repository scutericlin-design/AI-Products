      HOT_LEADER_AUTO_ENABLED: ${HOT_LEADER_AUTO_ENABLED:-true}
      HOT_LEADER_AUTO_REFRESH_CALENDAR_DAYS: ${HOT_LEADER_AUTO_REFRESH_CALENDAR_DAYS:-75}
      HOT_LEADER_INTRADAY_ENABLED: ${HOT_LEADER_INTRADAY_ENABLED:-true}
