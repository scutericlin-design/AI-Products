      HOT_LEADER_LIVE_THEME_INTERVAL_MINUTES: ${HOT_LEADER_LIVE_THEME_INTERVAL_MINUTES:-5}
      HOT_LEADER_INTRADAY_ENTRY_ENABLED: ${HOT_LEADER_INTRADAY_ENTRY_ENABLED:-true}
