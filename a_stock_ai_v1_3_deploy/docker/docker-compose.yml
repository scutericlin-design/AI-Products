services:
  a-stock-ai-v1-4:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-A股市场实时感知引擎 v1.7}
      ENGINE_NAME: ${ENGINE_NAME:-A股市场实时感知引擎 v1.7}
      ENGINE_POSITIONING: ${ENGINE_POSITIONING:-market_realtime_perception_engine}
      TZ: ${TZ:-Asia/Shanghai}
      DRY_RUN: ${DRY_RUN:-false}
      AKSHARE_ENABLED: ${AKSHARE_ENABLED:-true}
      RUN_INTERVAL: ${RUN_INTERVAL:-300}
      LOOP_SECONDS: ${LOOP_SECONDS:-300}
      RUN_ON_START: ${RUN_ON_START:-true}
      WATCH_SYMBOLS: ${WATCH_SYMBOLS:-}
      MAX_CANDIDATES: ${MAX_CANDIDATES:-20}
      MAX_PUSH_STOCKS: ${MAX_PUSH_STOCKS:-3}
      MIN_TURNOVER_YI: ${MIN_TURNOVER_YI:-2.0}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.62}
      MAX_POSITION_WEIGHT: ${MAX_POSITION_WEIGHT:-0.12}
      MAX_RECOMMEND_PCT_CHANGE: ${MAX_RECOMMEND_PCT_CHANGE:-8.5}
      NEAR_LIMIT_UP_BUFFER: ${NEAR_LIMIT_UP_BUFFER:-0.015}
      BUY_RANGE_PULLBACK_PCT: ${BUY_RANGE_PULLBACK_PCT:-0.008}
      MAX_CHASE_PCT: ${MAX_CHASE_PCT:-0.012}
      STOP_LOSS_PCT: ${STOP_LOSS_PCT:-0.035}
      MIN_QUALITY_SCORE: ${MIN_QUALITY_SCORE:-55}
      SENTIMENT_MIN_BUY_SCORE: ${SENTIMENT_MIN_BUY_SCORE:-53}
      SENTIMENT_RISK_OFF_SCORE: ${SENTIMENT_RISK_OFF_SCORE:-38}
      SENTIMENT_PANIC_THRESHOLD: ${SENTIMENT_PANIC_THRESHOLD:-72}
      SENTIMENT_LOW_COVERAGE_COUNT: ${SENTIMENT_LOW_COVERAGE_COUNT:-5}
      SENTIMENT_FULL_COVERAGE_COUNT: ${SENTIMENT_FULL_COVERAGE_COUNT:-30}
      PUSH_NO_RECOMMENDATION: ${PUSH_NO_RECOMMENDATION:-false}
      PUSH_HEARTBEAT_ENABLED: ${PUSH_HEARTBEAT_ENABLED:-true}
      PUSH_HEARTBEAT_INTERVAL_MINUTES: ${PUSH_HEARTBEAT_INTERVAL_MINUTES:-15}
      PUSH_DEDUP_ENABLED: ${PUSH_DEDUP_ENABLED:-true}
      PUSH_DEDUP_SUMMARY_MINUTES: ${PUSH_DEDUP_SUMMARY_MINUTES:-60}
      PUSH_PRICE_CHANGE_THRESHOLD: ${PUSH_PRICE_CHANGE_THRESHOLD:-0.01}
      REVIEW_ENABLED: ${REVIEW_ENABLED:-false}
      REVIEW_HOUR: ${REVIEW_HOUR:-20}
      REVIEW_MINUTE: ${REVIEW_MINUTE:-0}
      REVIEW_TARGET_CHARS: ${REVIEW_TARGET_CHARS:-1000}
      SELF_LEARNING_ENABLED: ${SELF_LEARNING_ENABLED:-true}
      SELF_LEARNING_HOUR: ${SELF_LEARNING_HOUR:-20}
      SELF_LEARNING_MINUTE: ${SELF_LEARNING_MINUTE:-30}
      SELF_LEARNING_LOOKBACK_DAYS: ${SELF_LEARNING_LOOKBACK_DAYS:-30}
      SELF_LEARNING_MIN_SAMPLES: ${SELF_LEARNING_MIN_SAMPLES:-30}
      SELF_LEARNING_MAX_STEP_PCT: ${SELF_LEARNING_MAX_STEP_PCT:-0.08}
      SELF_LEARNING_APPLY_CHANGES: ${SELF_LEARNING_APPLY_CHANGES:-true}
      SELF_LEARNING_NOTIFY: ${SELF_LEARNING_NOTIFY:-true}
      SELF_LEARNING_COOLDOWN_DAYS: ${SELF_LEARNING_COOLDOWN_DAYS:-5}
      SELF_LEARNING_STABLE_MIN_WIN_RATE: ${SELF_LEARNING_STABLE_MIN_WIN_RATE:-0.55}
      SELF_LEARNING_STABLE_MIN_AVG_RETURN_PCT: ${SELF_LEARNING_STABLE_MIN_AVG_RETURN_PCT:-0.2}
      SELF_LEARNING_STABLE_MAX_STOP_RATE: ${SELF_LEARNING_STABLE_MAX_STOP_RATE:-0.12}
      SELF_LEARNING_AI_REVIEW_ENABLED: ${SELF_LEARNING_AI_REVIEW_ENABLED:-true}
      SELF_LEARNING_AI_MIN_CONFIDENCE: ${SELF_LEARNING_AI_MIN_CONFIDENCE:-0.65}
      PAPER_TRADING_ENABLED: ${PAPER_TRADING_ENABLED:-false}
      PAPER_INITIAL_CASH: ${PAPER_INITIAL_CASH:-1000000}
      PAPER_ACCOUNT_PATH: ${PAPER_ACCOUNT_PATH:-/app/storage/paper_account.json}
      PAPER_MAX_POSITION_PCT: ${PAPER_MAX_POSITION_PCT:-0.12}
      PAPER_SLIPPAGE_PCT: ${PAPER_SLIPPAGE_PCT:-0.001}
      PAPER_COMMISSION_RATE: ${PAPER_COMMISSION_RATE:-0.00025}
      PAPER_MIN_COMMISSION: ${PAPER_MIN_COMMISSION:-5}
      PAPER_STAMP_DUTY_RATE: ${PAPER_STAMP_DUTY_RATE:-0.0005}
      PAPER_LOT_SIZE: ${PAPER_LOT_SIZE:-100}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_BASE_URL: ${TUSHARE_BASE_URL:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_ENDPOINT: ${MINIMAX_ENDPOINT:-}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-}
      MINIMAX_PROVIDER: ${MINIMAX_PROVIDER:-custom}
      FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:?Set FEISHU_WEBHOOK in your deployment environment}
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_ENABLED: ${FEISHU_ENABLED:-true}
      SEND_IN_DRY_RUN: ${SEND_IN_DRY_RUN:-false}
      STORAGE_DIR: /app/storage
      SQLITE_DB_PATH: /app/storage/db.sqlite
    volumes:
      - ../storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-m", "app.main", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  a-stock-dashboard-v1-8:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "dashboard.server"]
    environment:
      APP_NAME: ${APP_NAME:-A股市场实时感知引擎 v1.7}
      ENGINE_NAME: ${ENGINE_NAME:-A股市场实时感知引擎 v1.7}
      ENGINE_POSITIONING: ${ENGINE_POSITIONING:-market_realtime_perception_engine}
      TZ: ${TZ:-Asia/Shanghai}
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 8080
      DASHBOARD_BASE_PATH: ${DASHBOARD_BASE_PATH:-/a-stock-dashboard}
      DRY_RUN: ${DRY_RUN:-false}
      RUN_INTERVAL: ${RUN_INTERVAL:-300}
      LOOP_SECONDS: ${LOOP_SECONDS:-300}
      MAX_PUSH_STOCKS: ${MAX_PUSH_STOCKS:-3}
      MAX_POSITION_WEIGHT: ${MAX_POSITION_WEIGHT:-0.12}
      MIN_TURNOVER_YI: ${MIN_TURNOVER_YI:-2.0}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.62}
      MAX_RECOMMEND_PCT_CHANGE: ${MAX_RECOMMEND_PCT_CHANGE:-8.5}
      NEAR_LIMIT_UP_BUFFER: ${NEAR_LIMIT_UP_BUFFER:-0.015}
      BUY_RANGE_PULLBACK_PCT: ${BUY_RANGE_PULLBACK_PCT:-0.008}
      MAX_CHASE_PCT: ${MAX_CHASE_PCT:-0.012}
      STOP_LOSS_PCT: ${STOP_LOSS_PCT:-0.035}
      MIN_QUALITY_SCORE: ${MIN_QUALITY_SCORE:-55}
      SENTIMENT_MIN_BUY_SCORE: ${SENTIMENT_MIN_BUY_SCORE:-53}
      SENTIMENT_RISK_OFF_SCORE: ${SENTIMENT_RISK_OFF_SCORE:-38}
      SENTIMENT_PANIC_THRESHOLD: ${SENTIMENT_PANIC_THRESHOLD:-72}
      SENTIMENT_LOW_COVERAGE_COUNT: ${SENTIMENT_LOW_COVERAGE_COUNT:-5}
      SENTIMENT_FULL_COVERAGE_COUNT: ${SENTIMENT_FULL_COVERAGE_COUNT:-30}
      PAPER_TRADING_ENABLED: ${PAPER_TRADING_ENABLED:-false}
      PAPER_INITIAL_CASH: ${PAPER_INITIAL_CASH:-1000000}
      PAPER_ACCOUNT_PATH: ${PAPER_ACCOUNT_PATH:-/app/storage/paper_account.json}
      PAPER_MAX_POSITION_PCT: ${PAPER_MAX_POSITION_PCT:-0.12}
      PAPER_SLIPPAGE_PCT: ${PAPER_SLIPPAGE_PCT:-0.001}
      PAPER_COMMISSION_RATE: ${PAPER_COMMISSION_RATE:-0.00025}
      PAPER_MIN_COMMISSION: ${PAPER_MIN_COMMISSION:-5}
      PAPER_STAMP_DUTY_RATE: ${PAPER_STAMP_DUTY_RATE:-0.0005}
      PAPER_LOT_SIZE: ${PAPER_LOT_SIZE:-100}
      SELF_LEARNING_MAX_STEP_PCT: ${SELF_LEARNING_MAX_STEP_PCT:-0.08}
      STORAGE_DIR: /app/storage
      SQLITE_DB_PATH: /app/storage/db.sqlite
    volumes:
      - ../storage:/app/storage
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    depends_on:
      - a-stock-ai-v1-4
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ping', timeout=5).read()",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
