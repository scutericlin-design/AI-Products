services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  trading-engine:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.trading"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "python", "-m", "app.trading.healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
